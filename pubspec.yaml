name: pos_final
description: A Flutter POS application supporting mobile and desktop platforms.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Local packages (Clean Architecture)
  domain:
    path: ./domain
  data:
    path: ./data

  app_settings: ^6.1.1
  badges: ^3.0.3
  flutter_flip_card: ^0.0.4
  lottie: ^3.1.3
  flutter_svg: ^2.0.10+1
  google_nav_bar: ^5.0.6
  flashy_tab_bar2: ^0.0.5
  flutter_spinkit: ^5.2.1
  barcode_scan2: ^4.5.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  cron: ^0.6.1
  cupertino_icons: ^1.0.8
  date_time_picker: ^2.1.0
  dio: ^5.7.0
  fluttertoast: ^8.2.8
  geolocator: ^14.0.1
  get_ip_address: ^0.0.7
  #google_fonts: ^6.2.1
  google_maps_flutter: ^2.12.1
  http: ^1.2.2
  image_picker: ^1.1.2
  material_design_icons_flutter: ^7.0.7296
  path_provider: ^2.1.5
  pdf: ^3.11.1
  permission_handler: ^12.0.0+1
  printing: ^5.13.4
  provider: ^6.1.2
  qr: ^3.0.2
  sqflite: ^2.4.1
  shared_preferences: ^2.3.0
  search_choices: ^2.2.2
  syncfusion_flutter_datepicker: ^29.2.7
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  htmltopdfwidgets: ^1.0.2
  sqflite_common_ffi: ^2.3.4+4
  equatable: ^2.0.5
  table_sticky_headers: ^2.0.5
  numberpicker: ^2.1.2
  window_manager: ^0.4.3
  desktop_window: ^0.4.0
  font_awesome_flutter: ^10.7.0
  logging: ^1.2.0
  csv: ^6.0.0
  file_saver: ^0.2.14
  path: ^1.9.1
  intl: ^0.18.1
  synchronized: ^3.3.1
  async: ^2.12.0
  audioplayers: ^6.4.0
  fl_chart: ^1.0.0

  flutter_inappwebview: ^6.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

dependency_overrides:
  intl: ^0.18.1

flutter_icons:
  android: "launcher_icon"
  image_path: "assets/logo/Blue Modern Up Arrow Illustration Financial Business Logo (1).png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/
    - assets/lottie/
    - assets/svg/
    - assets/fonts/
    - assets/config/
    - assets/logo/
    - i18n/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo.ttf
          weight: 700
    - family: IconBroken
      fonts:
        - asset: assets/fonts/icons.ttf